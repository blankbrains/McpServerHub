[project]
name = "mcp-hub-cli"
version = "0.3.0"
description = "Discover, configure, proxy, monitor, and publish MCP Servers with a local Gateway"
authors = [{ name = "McpServerHub", email = "mcp-hub@example.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
keywords = ["mcp", "ai", "agent", "claude", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "click>=8.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "httpx2>=2.5.0,<3.0.0",
    "psutil>=5.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.20",
    "rich>=13.0.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "jinja2>=3.1.0",
    "mcp>=2.0.0,<3.0.0",
    "aiofiles>=24.0.0",
    "aiosqlite>=0.20.0",
    "structlog>=24.0.0",
    "alembic>=1.13.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/blankbrains/McpServerHub"
Documentation = "https://github.com/blankbrains/McpServerHub#readme"
Source = "https://github.com/blankbrains/McpServerHub"

[project.scripts]
mcp-hub = "mcp_hub.cli.app:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_hub"]
artifacts = ["src/mcp_hub/web/static"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/mcp_hub/web/static"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4", "T20"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Body", "fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"src/mcp_hub/api/routes_admin.py" = ["ARG001"]
"tests/unit/test_registry.py" = ["ARG002"]

[tool.mypy]
strict = true
python_version = "3.10"
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
