name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mcp_hub
          POSTGRES_PASSWORD: ${{ github.run_id }}_${{ github.run_attempt }}
          POSTGRES_DB: mcp_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check src tests --output-format=github

      - name: Type check with mypy
        run: mypy src

      - name: Test with pytest
        env:
          MCP_HUB_DATABASE_URL: postgresql+asyncpg://mcp_hub:${{ github.run_id }}_${{ github.run_attempt }}@localhost:5432/mcp_hub
        run: |
          pytest tests/ -v --tb=short

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/mcp_hub/web/package-lock.json

      - name: Build and audit frontend
        working-directory: src/mcp_hub/web
        run: |
          npm ci
          npm audit --audit-level=high --registry=https://registry.npmjs.org
          npm run build

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
