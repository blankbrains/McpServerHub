version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mcp_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mcp_hub}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mcp_hub} -d ${POSTGRES_DB:-mcp_hub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  hub:
    build: .
    environment:
      MCP_HUB_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mcp_hub}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-mcp_hub}
      MCP_HUB_SECRET: ${MCP_HUB_SECRET:?Set MCP_HUB_SECRET in .env}
      MCP_HUB_GITHUB_CLIENT_ID: ${MCP_HUB_GITHUB_CLIENT_ID:?Set MCP_HUB_GITHUB_CLIENT_ID in .env}
      MCP_HUB_GITHUB_CLIENT_SECRET: ${MCP_HUB_GITHUB_CLIENT_SECRET:?Set MCP_HUB_GITHUB_CLIENT_SECRET in .env}
      MCP_HUB_GITHUB_REDIRECT_URI: ${MCP_HUB_GITHUB_REDIRECT_URI:?Set MCP_HUB_GITHUB_REDIRECT_URI in .env}
      MCP_HUB_HOST: 0.0.0.0
      MCP_HUB_PORT: 3987
    ports:
      - "3987:3987"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3987/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
